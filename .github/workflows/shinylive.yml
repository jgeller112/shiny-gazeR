# Build shiny gazeR for the browser (shinylive / webR) and deploy it to
# GitHub Pages.
#
# gazeR and shinygazer are built for WebAssembly by r-universe
# (https://jgeller112.r-universe.dev); the app installs them from there when
# it starts. This workflow only exports shinylive-app/ (bundling the CRAN
# packages) and publishes it.
#
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions".

name: shinylive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::shinylive
            local::.

      - name: Export app with shinylive
        shell: Rscript {0}
        run: shinylive::export("shinylive-app", "_site")

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
