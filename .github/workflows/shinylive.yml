# Build shiny gazeR for the browser (shinylive / webR) and deploy it to
# GitHub Pages.
#
# gazeR and shinygazer are installed from r-universe
# (https://jgeller112.r-universe.dev), which also builds them for
# WebAssembly. shinylive bundles packages from r-universe (but not packages
# installed straight from GitHub, which need wasm builds attached to a GitHub
# release), so the exported site contains everything the app needs.
#
# Based on posit-dev/r-shinylive's deploy-app workflow (GitHub version of
# shinylive), exporting shinylive-app/ rather than the repo root since this
# repo is an R package.
#
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions".

name: shinylive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            github::posit-dev/r-shinylive
            any::sessioninfo

      - name: Install gazeR and shinygazer from r-universe
        shell: Rscript {0}
        run: |
          install.packages(c("gazer", "shinygazer"),
                           repos = c("https://jgeller112.r-universe.dev", getOption("repos")))
          sessioninfo::package_info(c("gazer", "shinygazer"), dependencies = FALSE)

      - name: Export app with shinylive
        shell: Rscript {0}
        run: |
          sessioninfo::session_info(c("shinylive", "shiny"))
          shinylive::export("shinylive-app", "_site")

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
